<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DZAKI DANISWARA // ZINE PROFILE</title>

<!-- Google Fonts: Permanent Marker (Style Tulisan Tangan/Spidol) & Space Mono (Style Mesin Tik/Raw) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">

<style>
/* --- CSS VARIABLES & RESET --- */
:root {
--bg-black: #0d0d0d;
--paper-white: #f4f4f0;
--punk-red: #ff0033;
--punk-yellow: #ffea00;
--font-head: 'Permanent Marker', cursive, sans-serif;
--font-body: 'Space Mono', monospace;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
background-color: var(--bg-black);
color: var(--paper-white);
font-family: var(--font-body);
padding: 20px;
/* Texture halftone/photocopy overlay */
background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
background-size: 4px 4px;
overflow-x: hidden;
}

/* --- CONTAINER UTAMA (GAYA ZINE PAGE) --- */
.zine-container {
max-width: 800px;
margin: 0 auto;
background-color: var(--paper-white);
color: var(--bg-black);
border: 5px solid var(--bg-black);
padding: 25px;
box-shadow: 12px 12px 0px var(--punk-red), -6px -6px 0px var(--punk-yellow);
position: relative;
transform: rotate(-0.5deg);
}

/* --- HEADER / BANNER DIY --- */
header {
text-align: center;
border-bottom: 4px dashed var(--bg-black);
padding-bottom: 20px;
margin-bottom: 30px;
position: relative;
}

.zine-tag {
background-color: var(--punk-yellow);
color: var(--bg-black);
font-weight: bold;
display: inline-block;
padding: 4px 12px;
transform: rotate(-3deg);
font-size: 0.9rem;
border: 2px solid var(--bg-black);
box-shadow: 3px 3px 0px var(--bg-black);
margin-bottom: 10px;
text-transform: uppercase;
}

h1.title {
font-family: var(--font-head);
font-size: clamp(2.2rem, 6vw, 3.8rem);
line-height: 1.1;
color: var(--bg-black);
text-shadow: 3px 3px 0px var(--punk-red);
text-transform: uppercase;
letter-spacing: -1px;
word-break: break-word;
}

/* --- FRAME FOTO (PHOTO CUT-OUT STICKER) --- */
.photo-section {
display: flex;
justify-content: center;
margin-bottom: 35px;
}

.photo-frame {
position: relative;
width: 240px;
height: 280px;
background-color: var(--bg-black);
border: 4px solid var(--bg-black);
padding: 10px 10px 45px 10px; /* Frame gaya Polaroid/Cutout */
transform: rotate(2deg);
box-shadow: 8px 8px 0px var(--punk-yellow);
transition: transform 0.2s ease;
}

.photo-frame:hover {
transform: rotate(-1deg) scale(1.03);
}

.photo-placeholder {
width: 100%;
height: 100%;
background-color: #222;
border: 2px dashed var(--paper-white);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
color: var(--paper-white);
text-align: center;
padding: 10px;
overflow: hidden;
position: relative;
}

.photo-placeholder img {
width: 100%;
height: 100%;
object-fit: cover;
filter: grayscale(100%) contrast(150%);
display: none; /* Muncul jika gambar dimasukkan */
}

.photo-label {
position: absolute;
bottom: 8px;
left: 50%;
transform: translateX(-50%) rotate(-2deg);
font-family: var(--font-head);
background-color: var(--punk-red);
color: var(--paper-white);
padding: 2px 10px;
font-size: 0.9rem;
white-space: nowrap;
}

/* --- GRID BIODATA (CUT-OUT CARDS) --- */
.bio-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap: 20px;
margin-bottom: 30px;
}

.bio-item {
background-color: var(--paper-white);
border: 3px solid var(--bg-black);
padding: 15px;
position: relative;
box-shadow: 5px 5px 0px var(--bg-black);
}

/* Rotasi acak untuk efek tempelan majalah zine */
.bio-item:nth-child(even) {
transform: rotate(1deg);
}

.bio-item:nth-child(odd) {
transform: rotate(-1.5deg);
}

.bio-label {
font-family: var(--font-head);
font-size: 1.1rem;
background-color: var(--bg-black);
color: var(--punk-yellow);
display: inline-block;
padding: 2px 8px;
margin-bottom: 8px;
text-transform: uppercase;
}

.bio-value {
font-size: 1.1rem;
font-weight: 700;
color: var(--bg-black);
line-height: 1.4;
}

.highlight-red {
background-color: var(--punk-red);
color: var(--paper-white);
padding: 0 4px;
}

.highlight-yellow {
background-color: var(--punk-yellow);
color: var(--bg-black);
padding: 0 4px;
}

/* --- STICKER / DEKORASI PUNK --- */
.stamp {
position: absolute;
top: -15px;
right: -10px;
background-color: var(--punk-red);
color: var(--paper-white);
font-family: var(--font-head);
padding: 5px 12px;
border: 2px solid var(--bg-black);
transform: rotate(12deg);
font-size: 0.85rem;
box-shadow: 3px 3px 0px var(--bg-black);
pointer-events: none;
}

/* --- INTERACTIVE NOISE / FOOTER SECTION --- */
footer {
border-top: 4px solid var(--bg-black);
padding-top: 20px;
text-align: center;
}

.interactive-btn {
background-color: var(--bg-black);
color: var(--punk-yellow);
font-family: var(--font-head);
font-size: 1.2rem;
padding: 12px 24px;
border: 3px solid var(--punk-red);
cursor: pointer;
box-shadow: 6px 6px 0px var(--punk-red);
transition: all 0.1s ease;
text-transform: uppercase;
}

.interactive-btn:hover {
background-color: var(--punk-red);
color: var(--paper-white);
transform: translate(-2px, -2px);
box-shadow: 8px 8px 0px var(--bg-black);
}

.interactive-btn:active {
transform: translate(4px, 4px);
box-shadow: 0px 0px 0px var(--bg-black);
}

#quote-box {
margin-top: 20px;
font-weight: bold;
min-height: 40px;
font-size: 0.95rem;
color: var(--bg-black);
background-color: var(--punk-yellow);
border: 2px solid var(--bg-black);
padding: 10px;
display: none;
}

/* --- RESPONSIVE ADJUSTMENTS --- */
@media (max-width: 600px) {
body {
padding: 10px;
}
.zine-container {
padding: 15px;
}
.bio-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>

<div class="zine-container">
<!-- Stamp D.I.Y. Dekoratif -->
<div class="stamp">ISSUE #01</div>

<!-- HEADER -->
<header>
<div class="zine-tag">Personal Zine / Profile Data</div>
<h1 class="title">DZAKI DANISWARA</h1>
</header>

<!-- FRAME FOTO -->
<section class="photo-section">
<div class="photo-frame">
<div class="photo-placeholder" id="photo-container">
<!-- Foto default / Placeholder -->
<span style="font-size: 2rem; font-family: var(--font-head);">[ FOTO ]</span>
<small style="margin-top: 5px; font-size: 0.75rem;">Tempel foto di sini<br>(Klik untuk ganti)</small>
<img id="user-photo" src="" alt="Foto Profil Dzaki">
</div>
<div class="photo-label">PHOTO_ID_19</div>
<!-- Input hidden untuk upload gambar lokal jika diinginkan -->
<input type="file" id="photo-input" accept="image/*" style="display: none;">
</div>
</section>

<!-- BIODATA GRID -->
<section class="bio-grid">

<div class="bio-item">
<div class="bio-label">Nama Lengkap</div>
<div class="bio-value">Dzaki Daniswara</div>
</div>

<div class="bio-item">
<div class="bio-label">Tempat, Tgl Lahir</div>
<div class="bio-value">Bandung, <span class="highlight-yellow">15 November 2010</span></div>
</div>

<div class="bio-item">
<div class="bio-label">Sekolah</div>
<div class="bio-value">SMPN 19 BANDUNG</div>
</div>

<div class="bio-item">
<div class="bio-label">Kelas</div>
<div class="bio-value"><span class="highlight-red">X-G</span></div>
</div>

<div class="bio-item">
<div class="bio-label">Agama</div>
<div class="bio-value">Islam</div>
</div>

<div class="bio-item">
<div class="bio-label">Hobi</div>
<div class="bio-value">Mendengarkan Musik 🎧</div>
</div>

<div class="bio-item" style="grid-column: 1 / -1; transform: rotate(0.5deg);">
<div class="bio-label" style="background-color: var(--punk-red); color: var(--paper-white);">Cita - Cita</div>
<div class="bio-value" style="font-size: 1.4rem; font-family: var(--font-head); margin-top: 5px;">
💰 <span class="highlight-yellow">KAYA</span> 💰
</div>
</div>

</section>

<!-- FOOTER & INTERACTIVE JS -->
<footer>
<button class="interactive-btn" id="punk-btn">CLICK FOR NOISE!</button>
<div id="quote-box"></div>
</footer>
</div>

<!-- JAVASCRIPT LOGIC -->
<script>
document.addEventListener('DOMContentLoaded', () => {
// 1. Fitur Upload / Ganti Foto Interaktif
const photoContainer = document.getElementById('photo-container');
const photoInput = document.getElementById('photo-input');
const userPhoto = document.getElementById('user-photo');

photoContainer.addEventListener('click', () => {
photoInput.click();
});

photoInput.addEventListener('change', (e) => {
const file = e.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(event) {
userPhoto.src = event.target.result;
userPhoto.style.display = 'block';
}
reader.readAsDataURL(file);
}
});

// 2. Tombol Interaktif Zine / Generator Slogan DIY
const punkBtn = document.getElementById('punk-btn');
const quoteBox = document.getElementById('quote-box');

const punkQuotes = [
"NO MUSIC, NO LIFE! 🎸",
"STAY TRUE, STAY DIY! ⚡",
"LOUD, PROUD, & INDEPENDENT! 🔊",
"SMPN 19 BANDUNG HARDCORE! 🔥",
"TURN UP THE VOLUME! 🎧",
"FUTURE MILLIONAIRE IN THE MAKING! 💸"
];

punkBtn.addEventListener('click', () => {
// Ambil slogan acak
const randomIndex = Math.floor(Math.random() * punkQuotes.length);
quoteBox.textContent = punkQuotes[randomIndex];
quoteBox.style.display = 'block';

// Efek flash warna latar singkat
document.body.style.backgroundColor = '#ff0033';
setTimeout(() => {
document.body.style.backgroundColor = 'var(--bg-black)';
}, 100);
});
});
</script>
</body>
    </html>
